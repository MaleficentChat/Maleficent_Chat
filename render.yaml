services:
  - type: web
    name: maleficent-chat
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: OWNER_USERNAME
        value: Maleficent
      - key: OWNER_PASSWORD
        sync: false
      - key: OWNER_DISPLAY_NAME
        value: Maleficent
